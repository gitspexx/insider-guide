# NOTE: this file is NOT what insiderguide.co serves.
# The live container (insider-guide-back, :3013) is built by
# insiderguide/docker-compose.yml with `context: .` from inside
# insiderguide/, so it uses insiderguide/nginx.conf. Change both, or
# change that one. This root copy pairs with the root Dockerfile.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        # The shell must never be served stale by a BROWSER (max-age=0 +
        # must-revalidate), but Cloudflare may hold it briefly (s-maxage).
        #
        # It used to say no-store, which forbade the edge from keeping it at
        # all, so every page view travelled Bali -> HKG edge -> Germany and back
        # while the origin itself answered in 0.5ms. Measured from Bali that was
        # a 0.60s floor with regular 5-6s spikes and the occasional >30s hang.
        # With s-maxage the revalidation stops at the HKG edge (~90ms) instead.
        #
        # The deploy purges the edge afterwards, so a new build is never masked
        # by the old shell pointing at a bundle hash that no longer exists.
        add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate";
    }

    # Real 404 for missing static assets — don't fall back to index.html
    location ~* \.(json|xml|txt|map)$ {
        try_files $uri =404;
    }

    # Real 404 for /api/* paths that don't have a static fallback
    location /api/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
