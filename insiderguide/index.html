<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Insider Guide</title>
    <meta name="description" content="Curated travel guides by creators who've actually been there." />
    <!-- Brand-level social defaults. Social scrapers don't run JS, so these are
         what FB/WhatsApp/LinkedIn/X see on every URL until prerender ships;
         React's <Seo> sets per-page title/description/canonical for Google. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Insider Guide" />
    <meta property="og:title" content="Insider Guide — Curated travel guides by creators who've been there" />
    <meta property="og:description" content="Where to eat, stay and explore, country by country — hand-picked by creators travelers trust." />
    <meta property="og:url" content="https://insiderguide.co/" />
    <meta property="og:image" content="https://insiderguide.co/hero-reel.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Insider Guide — Curated travel guides" />
    <meta name="twitter:description" content="Where to eat, stay and explore, country by country — hand-picked by creators travelers trust." />
    <meta name="twitter:image" content="https://insiderguide.co/hero-reel.jpg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://qbzmsvfphpfgnlztskma.supabase.co" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,300..600;1,14..32,300..600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Analytics: Umami (self-hosted, cookieless) + Nucleo first-party beacon.
         Neither sets cookies, so no consent banner is needed. data-domains keeps
         localhost / previews out of Umami (www serves the site too, no redirect). -->
    <script defer src="https://analytics.spexx.cloud/script.js" data-website-id="7c5b1dee-f795-47b3-9dfb-082c428891e1" data-domains="insiderguide.co,www.insiderguide.co"></script>
    <script>
(function (w, d) {
  var ENDPOINT = "https://nucleo.spexx.cloud/api/track";
  var q = new URLSearchParams(w.location.search);
  var g = function (k) { return q.get(k) || null; };

  // Attribution as stamped on the landing URL (by our short links or an ad).
  var fresh = {
    utm: { source: g("utm_source"), medium: g("utm_medium"), campaign: g("utm_campaign"), content: g("utm_content"), term: g("utm_term") },
    n_lead: g("n_lead"), n_send: g("n_send"), ctwa_clid: g("ctwa_clid")
  };
  var has = fresh.n_lead || fresh.n_send || fresh.ctwa_clid ||
            fresh.utm.source || fresh.utm.medium || fresh.utm.campaign || fresh.utm.content || fresh.utm.term;

  // Keep it for the visit: a later page or a form submit still attributes.
  var attr = fresh, sid = null, newSession = false;
  try {
    if (has) w.sessionStorage.setItem("nucleo_attr", JSON.stringify(fresh));
    else attr = JSON.parse(w.sessionStorage.getItem("nucleo_attr") || "null") || fresh;
    sid = w.sessionStorage.getItem("nucleo_sid");
    if (!sid) {
      sid = Math.random().toString(36).slice(2) + Date.now().toString(36);
      w.sessionStorage.setItem("nucleo_sid", sid);
      newSession = true;
    }
  } catch (e) { /* storage blocked: still track, just without continuity */ }

  function send(event, props) {
    var body = JSON.stringify({
      event: event, props: props || null,
      url: w.location.href, referrer: d.referrer || null,
      utm: attr.utm, n_lead: attr.n_lead, n_send: attr.n_send, ctwa_clid: attr.ctwa_clid, sid: sid
    });
    // text/plain → a "simple" request: no CORS preflight, survives page unload.
    try { if (navigator.sendBeacon && navigator.sendBeacon(ENDPOINT, new Blob([body], { type: "text/plain" }))) return; } catch (e) {}
    try { fetch(ENDPOINT, { method: "POST", body: body, keepalive: true, headers: { "Content-Type": "text/plain" } }).catch(function () {}); } catch (e) {}
  }

  w.nucleo = { track: send };
  if (newSession) send("session_start");
  send("page_view");
})(window, document);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
