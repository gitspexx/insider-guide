server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /index.html {
        # Browsers still revalidate every load (max-age=0 + must-revalidate),
        # but Cloudflare may hold the shell briefly (s-maxage).
        #
        # It used to say no-store, which forbade the edge from keeping it at
        # all, so every page view travelled Bali -> HKG edge -> Germany and back
        # while the origin container answered in 0.5ms. Measured from Bali: a
        # 0.60s floor, regular 5-6s spikes, one >30s hang. With s-maxage the
        # revalidation stops at the nearest edge (~90ms) instead.
        #
        # The deploy purges the edge afterwards, so a new build is never masked
        # by an old shell pointing at a bundle hash the image no longer has.
        add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate";
    }

    # Real 404 for missing static assets — don't fall back to index.html
    location ~* \.(json|xml|txt|map)$ {
        try_files $uri =404;
    }

    # Real 404 for /api/* paths that don't have a static fallback
    location /api/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
